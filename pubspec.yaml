name: act_cms
description: Act CMS
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  cached_network_image: ^3.2.3
  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.1
  firebase_crashlytics: ^3.3.1
  firebase_dynamic_links: ^5.3.1
  firebase_core_platform_interface: ^4.7.0
  url_launcher: ^6.1.11
  share_plus: ^7.2.1
  shared_preferences: ^2.1.1
  package_info_plus: ^5.0.1
  bloc: ^8.1.1
  flutter_bloc: ^8.0.2
  auto_route: ^6.4.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  multiple_result: ^5.1.0
  path_provider: ^2.1.1
  json_annotation: ^4.8.1
  provider: ^6.0.3
  flutter_native_splash: ^2.3.0
  flutter_inappwebview: ^5.7.1
  flutter_easyloading: ^3.0.5
  flutter_native_image: ^0.0.6+1
  flutter_custom_clippers: ^2.1.0
  flutter_secure_storage: ^8.0.0
  flutter_svg: ^2.0.5
  tap_debouncer: ^2.0.2
  image_picker: ^1.0.2
  in_app_review: ^2.0.6
  dio: ^5.4.3
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.2.0-beta-1
  event_bus_plus: ^0.6.1
  app_tracking_transparency: ^2.0.4
  path: ^1.8.3
  intl: ^0.18.0
  photo_view: ^0.14.0
  flutter_widget_from_html: ^0.10.3
  flutter_html: ^3.0.0-beta.2
  flutter_localizations:
    sdk: flutter
  flutter_linkify: ^6.0.0
  email_validator: ^2.1.17
  flutter_pdfview: ^1.3.1
  hand_signature: ^3.0.1
  easy_sidemenu: ^0.5.0
  logging: ^1.2.0
  syncfusion_flutter_pdfviewer: ^23.2.6
  syncfusion_flutter_charts: ^23.2.6
  syncfusion_flutter_datagrid: ^23.2.6
  syncfusion_flutter_datepicker: ^23.2.6

  # syncfusion_flutter_charts: 22.2.12
  # syncfusion_flutter_datagrid: 22.2.12
  # syncfusion_flutter_datepicker: 22.2.12
  # syncfusion_flutter_pdfviewer: 22.2.12
  number_paginator: ^0.4.0
  html_editor_enhanced:
    path: ./html-editor-enhanced
  month_year_picker: ^0.3.0+1
  month_picker_dialog: ^2.2.1
  pointer_interceptor: ^0.9.3+7
  url_strategy: ^0.2.0
  image_picker_web: ^3.1.1
  sentry_flutter: ^7.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  auto_route_generator: ^6.2.0
  build_runner: ^2.4.4
  json_serializable: ^6.7.0
  retrofit_generator: ^8.1.0
  test: ^1.24.3
  bloc_test: ^9.0.1 # 사용 가능한 가장 최신 버전을 사용하세요.
  mockito: ^5.0.16
  dartz: ^0.10.0
# splash config
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_round.png
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - lib/l10n/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Bold.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
        - asset: assets/fonts/Pretendard-Regular.ttf
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomMenuIcons.ttf
